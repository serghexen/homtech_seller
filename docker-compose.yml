services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - seller_pgdata:/var/lib/postgresql/data
    ports:
      # База не доступна извне: локальная разработка подключается только через SSH-туннель к loopback-порту VM.
      - "127.0.0.1:${SELLER_POSTGRES_TUNNEL_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 900m
    cpus: "0.75"

  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8000"
    mem_limit: 350m
    cpus: "0.50"

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE: /api
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:18081:80"
    mem_limit: 120m
    cpus: "0.20"

  worker:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SYNC_WORKER_POLL_SECONDS: ${SYNC_WORKER_POLL_SECONDS:-2}
      SYNC_JOB_STALE_SECONDS: ${SYNC_JOB_STALE_SECONDS:-300}
    command: ["python", "worker.py"]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 350m
    cpus: "0.50"

  notifier:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SELLER_TELEGRAM_NOTIFICATIONS_ENABLED: ${SELLER_TELEGRAM_NOTIFICATIONS_ENABLED:-false}
      SELLER_TELEGRAM_BOT_TOKEN: ${SELLER_TELEGRAM_BOT_TOKEN:-}
      SELLER_TELEGRAM_API_BASE: ${SELLER_TELEGRAM_API_BASE:-https://api.telegram.org}
      HTTPS_PROXY: ${SELLER_TELEGRAM_HTTPS_PROXY:-}
      SELLER_TELEGRAM_POLL_SECONDS: ${SELLER_TELEGRAM_POLL_SECONDS:-10}
      SELLER_TELEGRAM_LEASE_SECONDS: ${SELLER_TELEGRAM_LEASE_SECONDS:-90}
      SELLER_TELEGRAM_BATCH_SIZE: ${SELLER_TELEGRAM_BATCH_SIZE:-20}
      SELLER_TELEGRAM_REQUEST_ATTEMPTS: ${SELLER_TELEGRAM_REQUEST_ATTEMPTS:-3}
    command: ["python", "notifier.py"]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 100m
    cpus: "0.15"

  migrate:
    build: ./api
    profiles: ["maintenance"]
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: ["python", "scripts/run_migrations.py", "/migrations"]
    volumes:
      - ./db/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  seller_pgdata:
