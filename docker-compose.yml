services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - seller_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 900m
    cpus: "0.75"

  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8000"
    mem_limit: 350m
    cpus: "0.50"

  migrate:
    build: ./api
    profiles: ["maintenance"]
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: ["python", "scripts/run_migrations.py", "/migrations"]
    volumes:
      - ./db/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  seller_pgdata:
